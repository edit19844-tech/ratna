[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/satta-live-sync"
  to = "/.netlify/functions/satta-live-sync"
  status = 200

[[redirects]]
  from = "/api/satta-chart"
  to = "/.netlify/functions/satta-chart"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
